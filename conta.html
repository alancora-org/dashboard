<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Minha conta | ÂNCORA</title>
        <meta name="theme-color" content="#10263b" />

        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/painel.css" />

        <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />

        <script src="js/config.js" defer></script>
        <script src="js/painel.js" defer></script>
        <script src="js/conta.js" defer></script>
    </head>

    <body>
        <a class="skip-link" href="#main">Ir para o conteúdo</a>

        <div class="workspace">
            <header class="workspace-header">
                <a class="brand" href="painel.html" aria-label="ÂNCORA - início">
                    <img src="assets/logo.svg" alt="" width="32" height="32" />
                    <span>ÂNCORA</span>
                </a>

                <div class="header-actions">
                    <a href="mailto:contato@alancora.org">Precisa de ajuda?</a>

                    <button id="logout" type="button" hidden>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 5H5v14h4M13 8l4 4-4 4M8 12h12" />
                        </svg>
                        Sair
                    </button>
                </div>
            </header>

            <nav class="workspace-nav" aria-label="Navegação do painel">
                <a href="painel.html">Início</a>
                <a href="moradia.html">Moradia e necessidades</a>
                <a href="planos.html">Planos</a>
                <a href="conta.html" aria-current="page">Conta</a>
            </nav>

            <main id="main" tabindex="-1">
                <p id="account-message" class="notice" role="status" aria-live="polite">
                    Carregando sua conta...
                </p>

                <button id="retry" type="button" hidden>Tentar novamente</button>

                <section id="account" class="account" aria-labelledby="welcome" hidden>
                    <header class="welcome">
                        <h1 id="welcome">Minha conta</h1>

                        <p class="intro"> Confira os dados usados para acessar sua conta. </p>
                    </header>

                    <section class="profile-card account-page">
                        <div class="section-heading">
                            <span class="section-icon">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <circle cx="12" cy="8" r="3" />
                                    <path d="M5 20v-2a7 7 0 0 1 14 0v2" />
                                </svg>
                            </span>
                            <h2 id="account-title">Dados da conta</h2>
                        </div>

                        <dl>
                            <div>
                                <dt>Nome</dt>
                                <dd id="account-name"></dd>
                            </div>

                            <div>
                                <dt>E-mail</dt>
                                <dd id="account-email"></dd>
                            </div>
                        </dl>
                    </section>
                </section>

                <noscript>
                    <p>Ative o JavaScript para consultar sua conta.</p>
                </noscript>
            </main>

            <footer class="panel-footer">
                <a href="https://alancora.org">Conheça o projeto</a>
                <a href="mailto:contato@alancora.org">Precisa de ajuda? contato@alancora.org</a>
            </footer>
        </div>
    </body>
</html>
